name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A tag must not produce a release unless every runner in the matrix is
  # green, so the whole CI workflow runs first.
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Confirm the tag matches the packaged version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # Read the package attribute, not a pyproject key: the version is
          # declared dynamic there, so no static version key exists to read.
          PKG=$(python -c "import live_news_wall; print(live_news_wall.__version__)")
          echo "tag=$TAG packaged=$PKG"
          test "$TAG" = "$PKG" || { echo "tag $TAG does not match version $PKG"; exit 1; }

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Live News Debate Wall $GITHUB_REF_NAME" \
            --notes-file .github/RELEASE_NOTES.md \
            --verify-tag
