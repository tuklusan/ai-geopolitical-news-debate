[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "live-news-wall"
# Single source of truth: live_news_wall/__init__.py
dynamic = ["version"]
description = "A continuously running AI-parody debate wall driven by live business-news headlines."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Supratim Sanyal", email = "sanyal.duckdns.org.openvms.vax@gmail.com" }]
maintainers = [{ name = "Supratim Sanyal" }]
keywords = ["rss", "llm", "parody", "asyncio", "aiohttp", "news", "satire"]

# A bespoke non-commercial licence: not an SPDX identifier, so the file is
# shipped and the classifier says "Other/Proprietary".
license-files = ["LICENSE"]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: AsyncIO",
  "Intended Audience :: End Users/Desktop",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Games/Entertainment",
]

dependencies = [
  "aiohttp>=3.9,<4.0",
  "beautifulsoup4>=4.12",
  # Required indirectly: BeautifulSoup uses lxml as the "xml" parser.
  "lxml>=5.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/tuklusan/ai-geopolitical-news-debate"
Repository = "https://github.com/tuklusan/ai-geopolitical-news-debate"
Article = "https://supratim-sanyal.blogspot.com/2026/07/build-live-ai-news-debate-wall-chatdev-linux.html"

[project.scripts]
live-news-wall = "live_news_wall.app:main"

[tool.setuptools.dynamic]
version = { attr = "live_news_wall.__version__" }

[tool.setuptools]
# Explicit: the repository root also holds tests/ and docs/, which must not
# be swept into the distribution by automatic discovery.
packages = ["live_news_wall"]

[tool.setuptools.package-data]
# The starter config must reach wheel users, who have no checkout to copy from.
live_news_wall = ["env.example"]
